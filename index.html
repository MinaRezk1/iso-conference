<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>ISO Conference 2026</title>
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0f0f15" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="ISO 2026" />
    
    <!-- iOS support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ISO 2026" />
    <link rel="apple-touch-icon" href="/reflect-logo.png" />

    <!-- Favicon and Manifest -->
    <link rel="icon" type="image/png" href="/reflect-logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      // Global PWA Prompt Capture
      window.deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPwaPrompt = e;
        window.dispatchEvent(new Event('pwa-prompt-ready'));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
