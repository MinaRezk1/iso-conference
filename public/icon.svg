<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1e1e2f" />
      <stop offset="100%" stop-color="#0f0f15" />
    </radialGradient>
    
    <!-- Fingerprint Glowing Amber Gradient -->
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Subtle Shadow -->
    <filter id="glow-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Icon Frame -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="#27273a" stroke-width="6"/>

  <!-- Reflection Accent Top Left -->
  <path d="M 30,120 Q 120,30 240,30" fill="none" stroke="white" stroke-width="3" opacity="0.15" stroke-linecap="round" />
  
  <!-- Fingerprint Icon in the Center -->
  <g transform="translate(106, 106) scale(2)" filter="url(#glow-shadow)">
    <!-- Fingerprint Paths -->
    <path d="M75,100 C75,80 85,70 100,70 C115,70 125,80 125,100" fill="none" stroke="url(#glow-grad)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M63,110 C63,80 78,58 100,58 C122,58 137,80 137,110" fill="none" stroke="url(#glow-grad)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M51,120 C51,80 70,46 100,46 C130,46 149,80 149,120" fill="none" stroke="url(#glow-grad)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M39,130 C39,80 62,34 100,34 C138,34 161,80 161,130" fill="none" stroke="url(#glow-grad)" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Outer ripples -->
    <path d="M27,140 C27,80 54,22 100,22 C146,22 173,80 173,140" fill="none" stroke="url(#glow-grad)" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />
    <path d="M15,150 C15,80 46,10 100,10 C154,10 185,80 185,150" fill="none" stroke="url(#glow-grad)" stroke-width="4.5" stroke-linecap="round" opacity="0.5" />
    
    <!-- Inner swirls -->
    <path d="M87,110 C87,100 93,94 100,94 C107,94 113,100 113,110 L113,125" fill="none" stroke="url(#glow-grad)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M99,82 C101,82 103,82 105,82" fill="none" stroke="url(#glow-grad)" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- "ISO" text at the bottom center -->
  <text x="256" y="445" fill="#f59e0b" font-family="'Inter', 'Space Grotesk', sans-serif" font-size="34" font-weight="900" letter-spacing="6" text-anchor="middle" opacity="0.9">ISO</text>
</svg>
